 <!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKAVOX | Central Admin Terminal</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Dashboard Top Header Bar -->
        <div class="flex justify-between items-center mb-10 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-wider bg-gradient-to-r from-[#8a2be2] to-[#00ffff] bg-clip-text text-transparent">CKAVOX Engine</h1>
                <p class="text-xs font-mono text-gray-500 uppercase tracking-widest mt-1">Logged as: cedrickkayiranga354@gmail.com</p>
            </div>
            <div class="flex gap-4">
                <a href="index.html" target="_blank" class="text-xs bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg font-bold uppercase tracking-wider flex items-center">View Website</a>
                <button id="logout-action" class="text-xs bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-bold uppercase tracking-wider">Log out</button>
            </div>
        </div>

        <!-- Management Forms Section Layout Grid -->
        <div class="grid md:grid-cols-3 gap-8">
            
            <!-- Left inputs column: Operations Interface -->
            <div class="md:col-span-1 bg-[#1f2833] p-6 rounded-xl border border-gray-800 h-fit space-y-6">
                <h2 class="text-sm font-black uppercase tracking-wider text-[#00ffff] border-b border-gray-700 pb-2">Publish / Edit Content</h2>
                
                <form id="admin-publish-form" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-bold mb-2">Target Section</label>
                        <select id="post-category" class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#8a2be2]">
                            <option value="sports">Sports</option>
                            <option value="film">Film</option>
                            <option value="technology">Technology</option>
                            <option value="trending">Trending</option>
                            <option value="news">News</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-bold mb-2">Item Title Label</label>
                        <input type="text" id="post-title" required placeholder="e.g. F1 Updates" class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-bold mb-2">HD Image URL Link</label>
                        <input type="url" id="post-image" required placeholder="https://unsplash.com..." class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-2.5 text-xs text-gray-300 font-mono focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-[#8a2be2] to-[#00ffff] text-white text-xs font-black py-3 rounded-lg uppercase tracking-wider transition">
                        Push to Slideshow Loop
                    </button>
                </form>
            </div>

            <!-- Right list column: Live Database View with modifications actions -->
            <div class="md:col-span-2 bg-[#1f2833] p-6 rounded-xl border border-gray-800 space-y-4">
                <h2 class="text-sm font-black uppercase tracking-wider text-[#8a2be2] border-b border-gray-700 pb-2">Active Live Slideshow Elements</h2>
                
                <div id="admin-items-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    <!-- Javascript runtime feeds record modules here -->
                    <p class="text-gray-500 font-mono text-xs text-center py-6">Connecting to database tables...</p>
                </div>
            </div>

        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
