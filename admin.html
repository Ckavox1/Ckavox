<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CKAVOX Admin Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js" defer></script>
</head>

<body>

<header class="header">
  <a href="index.html" class="brand">
    <span class="brand-symbol">C</span>
    <span>CKA<span class="gold">VOX</span></span>
  </a>

  <a href="index.html" class="outline-button">View Website</a>
</header>

<main class="section">

  <div class="account-box">
    <span class="eyebrow">CONTENT MANAGEMENT</span>
    <h1>CKAVOX Admin Dashboard</h1>

    <p class="muted">
      Only authorized administrators can publish and manage stories.
    </p>

    <div id="adminStatus" role="status">Checking permissions...</div>

    <form id="postForm" hidden>

      <label for="title">Story title</label>
      <input id="title" maxlength="200" required>

      <label for="category">Category</label>
      <select id="category"
              style="width:100%;padding:12px;background:#090909;color:white"
              required>
        <option value="trending">Trending</option>
        <option value="news">Trending News</option>
        <option value="showbiz">Showbiz</option>
        <option value="sports">Sports / Formula 1</option>
        <option value="technology">Technology</option>
      </select>

      <label for="summary">Short summary</label>
      <textarea id="summary" maxlength="500" rows="3"
                style="width:100%;padding:12px;background:#090909;color:white"
                required></textarea>

      <label for="content">Full story (optional)</label>
      <textarea id="content" rows="6"
                style="width:100%;padding:12px;background:#090909;color:white"></textarea>

      <label for="imageUrl">HD image URL</label>
      <input id="imageUrl" type="url"
             placeholder="https://example.com/image.jpg">

      <label for="externalUrl">Source / Read More URL (optional)</label>
      <input id="externalUrl" type="url"
             placeholder="https://example.com/article">

      <label>
        <input type="checkbox" id="published" checked
               style="width:auto">
        Publish immediately
      </label>

      <button type="submit" class="gold-button">
        Publish Story
      </button>

    </form>

    <div id="adminMessage" role="status"></div>

  </div>

  <section style="max-width:900px;margin:35px auto">

    <h2>Manage Stories</h2>

    <div id="adminPosts" class="content-grid"></div>

  </section>

</main>

<footer class="footer">
  <p>CKAVOX Admin Dashboard</p>
  <a href="https://whatsapp.com/channel/0029VbECV9QADTOBu1T2nU3d"
     target="_blank" rel="noopener noreferrer">
    Follow CKAVOX on WhatsApp
  </a>
</footer>

</body>
</html>
