<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CKAVOX Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-container {
            max-width: 850px;
            margin: 25px auto;
            padding: 20px;
        }

        .admin-panel {
            padding: 20px;
            margin-bottom: 25px;
            background: #151515;
            border: 1px solid #f5c400;
            border-radius: 10px;
        }

        .admin-panel input,
        .admin-panel select,
        .admin-panel textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
        }

        .admin-panel button {
            padding: 12px 18px;
            margin: 5px 0;
            background: #f5c400;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #adminMessage {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<header>
    <h1>CKAVOX ADMIN</h1>
    <p>Manage your website content</p>
</header>

<main class="admin-container">

    <p id="adminMessage" aria-live="polite">Checking permissions...</p>

    <section class="admin-panel">
        <h2>Add Content</h2>

        <form id="contentForm">

            <input
                type="text"
                id="contentTitle"
                placeholder="Title"
                required
            >

            <select id="contentType" required>
                <option value="movie">Movie / Film</option>
                <option value="music">Music / Song</option>
                <option value="news">News</option>
                <option value="showbiz">Showbiz</option>
                <option value="sports">Sports</option>
                <option value="photo">Photos</option>
            </select>

            <input
                type="text"
                id="contentCategory"
                placeholder="Category, e.g. Action, African Music, Football"
                required
            >

            <textarea
                id="contentDescription"
                placeholder="Description"
            ></textarea>

            <label>Cover image</label>
            <input type="file" id="imageFile" accept="image/*">

            <label>Audio/video file (if permitted)</label>
            <input
                type="file"
                id="mediaFile"
                accept="audio/*,video/*"
            >

            <input
                type="url"
                id="externalUrl"
                placeholder="Optional official/external link"
            >

            <label>
                <input type="checkbox" id="publishContent">
                Publish content immediately
            </label>

            <button type="submit">SAVE CONTENT</button>
        </form>
    </section>

    <section class="admin-panel">
        <h2>Website Statistics</h2>
        <button id="refreshStats" type="button">REFRESH STATISTICS</button>
        <div id="statistics">Statistics not loaded.</div>
    </section>

    <section class="admin-panel">
        <h2>Manage Existing Content</h2>
        <button id="loadContent" type="button">LOAD CONTENT</button>
        <div id="contentList"></div>
    </section>

    <button id="logoutButton" type="button">SIGN OUT</button>

    <p><a href="index.html">Back to website</a></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>

</body>
</html>
