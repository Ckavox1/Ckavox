 
<!-- CKAVOX USER ACCOUNT -->
<section class="section account-section" id="account">
  <div class="account-box">
    <span class="eyebrow">YOUR CKAVOX ACCOUNT</span>
    <h2 id="accountHeading">Join the Community</h2>

    <p class="muted" id="accountDescription">
      Create an account or sign in to access your account.
    </p>

    <form id="authForm">
      <label for="displayName">Full name</label>
      <input id="displayName" type="text"
             maxlength="100" placeholder="Enter your name">

      <label for="email">Email address</label>
      <input id="email" type="email"
             placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             placeholder="Enter your password"
             minlength="8" required>

      <div class="auth-buttons">
        <button type="submit" id="signInButton"
                class="gold-button">Sign In</button>
        <button type="button" id="signUpButton"
                class="outline-button">Sign Up</button>
      </div>
    </form>

    <div id="authMessage" role="status"></div>

    <div id="userArea" hidden>
      <hr>
      <h3>My Account</h3>
      <p id="userName"></p>
      <p id="userEmail"></p>
      <p id="accountCreated"></p>

      <button id="signOutButton" class="outline-button">
        Sign Out
      </button>

      <p>
        <a href="admin.html" id="adminLink" hidden>
          Open Admin Dashboard
        </a>
      </p>
    </div>
  </div>
</section>
