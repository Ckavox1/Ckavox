 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Sign In | CKAVOX</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js" defer></script>

  <style>
    .login-page {
      min-height: 80vh;
      display: grid;
      place-items: center;
      padding: 35px 16px;
    }

    .login-panel {
      width: 100%;
      max-width: 520px;
      padding: 32px;
      border: 1px solid #333;
      border-radius: 18px;
      background: #141414;
    }

    .login-panel h1 { font-size: 32px; }

    .login-panel input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 8px 0 18px;
      color: white;
      background: #080808;
      border: 1px solid #444;
      border-radius: 7px;
    }

    .login-panel input:focus {
      outline: 1px solid #ffc928;
    }

    .login-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .login-panel button { cursor: pointer; }

    #authMessage {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="brand">
      <span class="brand-symbol">C</span>
      <span>CKA<span class="gold">VOX</span></span>
    </a>
    <a href="index.html" class="outline-button">Home</a>
  </header>

  <main class="login-page">
    <section class="login-panel">
      <span class="eyebrow">YOUR CKAVOX ACCOUNT</span>
      <h1 id="formTitle">Join the Community</h1>
      <p class="muted" id="formDescription">
        Create an account or sign in to access your account.
      </p>

      <form id="authForm">
        <div id="nameField">
          <label for="displayName">Full name</label>
          <input id="displayName" type="text"
                 maxlength="100" autocomplete="name"
                 placeholder="Enter your name">
        </div>

        <label for="email">Email address</label>
        <input id="email" type="email" required
               autocomplete="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input id="password" type="password" required
               minlength="8" autocomplete="current-password"
               placeholder="At least 8 characters">

        <div class="login-actions">
          <button type="submit" id="signInButton"
                  class="gold-button">Sign In</button>
          <button type="button" id="signUpButton"
                  class="outline-button">Sign Up</button>
        </div>
      </form>

      <div id="authMessage" role="status" aria-live="polite"></div>

      <section id="userArea" hidden>
        <h2>My Account</h2>
        <p id="userName"></p>
        <p id="userEmail"></p>
        <button id="signOutButton" class="outline-button">
          Sign Out
        </button>
        <p><a id="adminLink" href="admin.html" hidden>
          Open Admin Dashboard
        </a></p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <p>© CKAVOX. News. Entertainment. Technology. Sports.</p>
  </footer>
</body>
</html>
