 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CKAVOX</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 50px auto;
            padding: 25px;
            background: #151515;
            border: 1px solid #f5c400;
            border-radius: 12px;
        }

        .auth-container h1 {
            text-align: center;
            color: #f5c400;
        }

        .auth-container input {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #555;
        }

        .auth-container button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #f5c400;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-container a {
            color: #f5c400;
        }

        #authMessage {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <header>
        <h2>CKAVOX</h2>
        <p>Music • Movies • News • Showbiz</p>
    </header>

    <main class="auth-container">
        <h1>CKAVOX ACCOUNT</h1>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">SIGN IN</button>
        </form>

        <button id="signupButton" type="button">
            CREATE ACCOUNT
        </button>

        <p>
            <a href="#" id="forgotPassword">Forgot password?</a>
        </p>

        <p id="authMessage" aria-live="polite"></p>

        <a href="index.html">← Back to CKAVOX</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>

</body>
</html>
