<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKAVOX Admin Login</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen flex items-center justify-center">
    <div class="bg-[#1f2833] p-8 rounded-2xl border border-purple-500/30 w-full max-w-md">
        <h2 class="text-2xl font-black text-center bg-gradient-to-r from-[#8a2be2] to-[#00ffff] bg-clip-text text-transparent mb-6 uppercase">Admin Login</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-[#8a2be2] to-[#00ffff] text-white font-bold py-3 rounded-lg uppercase tracking-wider text-sm mt-4">Login</button>
        </form>
    </div>
    <script src="auth.js"></script>
</body>
</html>
