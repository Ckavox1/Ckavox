 <!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKAVOX | Secure Admin Gate</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen flex items-center justify-center px-4 font-sans">

    <div class="bg-[#1f2833] p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl relative">
        <a href="index.html" class="absolute top-4 left-4 text-xs font-bold uppercase tracking-wider text-gray-500 hover:text-[#00ffff] transition">← Back</a>
        
        <h2 class="text-2xl font-black text-center bg-gradient-to-r from-[#8a2be2] to-[#00ffff] bg-clip-text text-transparent mb-2 uppercase tracking-wide mt-4">Authorized Access</h2>
        <p class="text-xs text-center text-gray-400 mb-8 uppercase tracking-widest font-mono">CKAVOX Controlled Panel</p>

        
        <form id="login-flow-form" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2 font-bold">Admin Email Address</label>
                <input type="email" id="admin-email" value="cedrickkayiranga354@gmail.com" readonly class="w-full bg-[#0b0c10] border border-gray-700 rounded-lg p-3 text-gray-400 font-mono text-sm focus:outline-none">
            </div>

            <!-- Stage 1 Button: Requests Magic Authentication Code Token -->
            <button type="button" id="request-token-btn" class="w-full bg-gradient-to-r from-[#8a2be2] to-[#00ffff] text-white font-black py-3 rounded-lg uppercase tracking-wider text-xs transition transform active:scale-95 shadow-md">
                Send Authentication Code
            </button>

            <!-- Stage 2 Inputs: Hidden until Token dispatch confirmation fires -->
            <div id="otp-verification-area" class="hidden pt-4 border-t border-gray-800 space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-emerald-400 mb-2 font-bold">Enter Verification OTP Token</label>
                    <input type="text" id="otp-token" placeholder="Check your email for code..." class="w-full bg-[#0b0c10] border border-emerald-500 rounded-lg p-3 text-white font-mono tracking-widest text-center focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-lg uppercase tracking-wider text-xs transition transform active:scale-95">
                    Verify & Access Dashboard
                </button>
            </div>
        </form>

        <!-- Recovery / Standard Alternative Workflow Option -->
        <div class="mt-8 text-center border-t border-gray-800 pt-4">
            <button onclick="triggerPasswordRecovery()" class="text-xs font-bold uppercase tracking-wider text-purple-400 hover:underline">
                Password Recovery Option
            </button>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
